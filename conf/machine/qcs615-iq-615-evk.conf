#@TYPE: Machine
#@NAME: qcs615-iq-615-evk
#@DESCRIPTION: Machine configuration for Qualcomm IQ-615 Evaluation Kit(EVK), with qcs615

require conf/machine/include/qcom-qcs615.inc

MACHINE_FEATURES = "usbhost usbgadget alsa wifi bluetooth"

# Support emmc build with priority
MACHINEOVERRIDES .= ":emmc-storage"

# This DT is available in Linux stable tree, 6.6.y branch.
KERNEL_DEVICETREE:pn-linux-qcom-base = " \
                      qcom/talos-evk.dtb \
                      "
KERNEL_DEVICETREE:pn-linux-qcom-custom = " \
                      qcom/talos-addons-evk.dtb \
                      "

KERNEL_TECH_DTBOS[talos-addons-evk] = " \
    qcs615-graphics.dtbo \
    "

# Recipe providers of above dtbo files.
KERNEL_TECH_DTBO_PROVIDERS = "\
    qcom-graphicsdevicetree \
"
